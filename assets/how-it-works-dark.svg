<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <filter id="shadow-d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#010409" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .box { stroke-width: 1.4; filter: url(#shadow-d); }
    .lbl { font-size: 13px; font-weight: 600; fill: #e6edf3; text-anchor: middle; }
    .sub { font-size: 10.5px; fill: #8b949e; text-anchor: middle; }
    .edge { stroke: #6e7681; stroke-width: 1.4; fill: none; marker-end: url(#arrow-d); }
    .edge-dash { stroke-dasharray: 4 3; }
    .elbl { font-size: 10.5px; fill: #8b949e; text-anchor: middle; }
  </style>

  <!-- A: pattern -->
  <rect class="box" x="14" y="130" width="150" height="56" rx="10" fill="#21262d" stroke="#6e7681"/>
  <text class="lbl" x="89" y="154">pattern / GBNF</text>
  <text class="sub" x="89" y="170">/ JSON Schema</text>

  <path class="edge" d="M164,158 L204,158"/>

  <!-- B: byte automaton -->
  <rect class="box" x="204" y="130" width="150" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
  <text class="lbl" x="279" y="154">byte automaton</text>
  <text class="sub" x="279" y="170">regex/utf8.py</text>

  <path class="edge" d="M354,158 L400,158"/>

  <!-- C: diamond -->
  <polygon class="box" points="480,108 560,158 480,208 400,158" fill="#161b22" stroke="#30363d"/>
  <text class="lbl" x="480" y="154" font-size="12.5">regular?</text>
  <text class="sub" x="480" y="170">no recursion</text>

  <path class="edge" d="M560,158 L640,158 L640,88 L672,88"/>
  <text class="elbl" x="606" y="80">yes</text>

  <path class="edge" d="M480,208 L480,254 L672,254"/>
  <text class="elbl" x="500" y="246">no</text>

  <!-- D: dense table (fast) -->
  <rect class="box" x="672" y="60" width="170" height="56" rx="10" fill="#122117" stroke="#3fb950"/>
  <text class="lbl" x="757" y="84">dense tok_next</text>
  <text class="sub" x="757" y="100">table (gather)</text>

  <!-- E: PDA (slow) -->
  <rect class="box" x="672" y="226" width="170" height="56" rx="10" fill="#271d12" stroke="#d29922"/>
  <text class="lbl" x="757" y="250">pushdown</text>
  <text class="sub" x="757" y="266">automaton</text>

  <!-- E -> D spliced -->
  <path class="edge edge-dash" d="M757,226 L757,116"/>
  <text class="elbl" x="833" y="172">sub-loop spliced out</text>

  <!-- D -> F -->
  <path class="edge" d="M842,88 L880,88 L880,150 L900,150"/>

  <!-- E -> F structural -->
  <path class="edge" d="M842,254 L880,254 L880,166 L900,166"/>
  <text class="elbl" x="960" y="210">structural positions</text>

  <!-- F: kernel -->
  <rect class="box" x="900" y="130" width="160" height="56" rx="10" fill="#0d2b42" stroke="#58a6ff"/>
  <text class="lbl" x="980" y="154">mask / advance</text>
  <text class="sub" x="980" y="170">one kernel call</text>
</svg>
