[build-system]
requires = ["scikit-build-core>=0.10", "torch>=2.2", "cmake>=3.24", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "bpdecode"
version = "0.0.0"
description = "GPU-accelerated constrained decoding for LLM inference"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Zana Rashidi" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
hf = ["transformers>=4.40", "tokenizers>=0.19"]
bench = ["transformers>=4.40", "outlines>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "numpy", "lark>=1.1"]

[tool.scikit-build]
wheel.packages = ["src/bpdecode"]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
editable.mode = "redirect"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]
