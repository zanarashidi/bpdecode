[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpdecode"
version = "0.0.0"
description = "GPU-accelerated constrained decoding for LLM inference"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Zana Rashidi" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
hf = ["transformers>=4.40", "tokenizers>=0.19"]
torch = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/bpdecode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]
