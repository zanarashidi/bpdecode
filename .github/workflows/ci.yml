name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - name: Install CPU torch
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi
      - name: Build + install (scikit-build-core compiles csrc + the torch op)
        run: |
          pip install scikit-build-core cmake ninja
          pip install --no-build-isolation -e '.[dev]'
      - run: ruff check .
      - run: pytest

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build (host-only, no CUDA)
        run: |
          cmake -S csrc -B build-cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cpp -j
      - name: Test
        run: ctest --test-dir build-cpp --output-on-failure
